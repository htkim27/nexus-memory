[build-system]
requires = ["hatchling>=1.28"]
build-backend = "hatchling.build"

[project]
name = "nexus-memory"
version = "0.1.0"
description = "Memory-free AI2-THOR low-level agent baseline"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "ai2thor==5.0.0",
    "gradio==6.27.0",
    "numpy==2.5.3",
    "pillow==12.3.0",
]

[project.optional-dependencies]
vlm = [
    "accelerate==1.15.0",
    "huggingface-hub==1.31.0",
    "safetensors==0.8.0",
    "sentencepiece==0.2.2",
    "torch==2.14.0",
    "torchvision==0.29.0",
    "transformers==5.17.0",
    "bitsandbytes==0.49.2",
]

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "ruff==0.16.7",
]

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu130" }
torchvision = { index = "pytorch-cu130" }

[tool.hatch.build.targets.wheel]
include = [
    "app.py",
    "observer.py",
    "vanilla_agent.py",
    "inference.py",
    "inference_2.py",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
